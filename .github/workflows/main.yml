name: Main CI validation



on:

  push:
  
  pull_request:
  
  workflow_dispatch:
  


permissions:

  contents: read
  


jobs:

  validate:
  
    runs-on: ubuntu-latest
    
    timeout-minutes: 5
    
    steps:
    
      - name: Check out repository
      
        uses: actions/checkout@v4
        


      - name: Set up Python
      
        uses: actions/setup-python@v5
        
        with:
        
          python-version: "3.11"
          


      - name: Install dependencies
      
        run: python -m pip install -r "requirements (2).txt"
        


      - name: Compile Python files
      
        run: python -m compileall -q .
        


















